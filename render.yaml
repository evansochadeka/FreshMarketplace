services:
  - type: web
    name: marketplace-app
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: marketplace-db
          property: connectionString
    autoDeploy: true

databases:
  - name: marketplace-db
    databaseName: marketplace
    user: marketplace_user
