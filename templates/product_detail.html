{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-md-6">
        <img src="{{ product.image_url }}" class="img-fluid rounded" alt="{{ product.name }}">
    </div>
    <div class="col-md-6">
        <h1>{{ product.name }}</h1>
        <span class="badge bg-success mb-3">{{ product.category }}</span>
        <h2 class="text-success">${{ "%.2f"|format(product.price) }}</h2>
        <p class="lead">{{ product.description }}</p>
        <p class="text-muted">Available Stock: {{ product.stock }}</p>
        
        {% if session.user_id %}
        <form method="POST" action="{{ url_for('add_to_cart', id=product.id) }}">
            <div class="mb-3">
                <label class="form-label">Quantity:</label>
                <input type="number" name="quantity" class="form-control" value="1" min="1" max="{{ product.stock }}" style="width: 100px;">
            </div>
            <button type="submit" class="btn btn-success btn-lg">Add to Cart</button>
        </form>
        {% else %}
        <a href="{{ url_for('login') }}" class="btn btn-success btn-lg">Login to Purchase</a>
        {% endif %}
    </div>
</div>
{% endblock %}
